name: Firmware Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*' # tag needs to start with 'v' followed by version number, e.g., v1.0.0

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ==========================================
  # 1. Create Release
  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Publish Release
    secrets: inherit
    permissions:
      contents: write
    uses: ARTTU-Software/.github/.github/workflows/create-release.yml@main

  attach-can-database:
    needs: publish-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Attach versioned DBC and CAN headers
        env:
          GH_TOKEN: ${{ github.token }}
          CAN_TAG: ${{ github.ref_name }}
        run: |
          files=(MAIN_DBC.dbc drivers/can/can_signal_defs.h drivers/can/can_board_defs.h)
          if [ -f can-database-source.json ]; then
            files+=(can-database-source.json)
          fi
          gh release upload "$CAN_TAG" "${files[@]}" --clobber
