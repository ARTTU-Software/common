name: Sync CAN database

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

# Manual and scheduled runs share a lock. Never cancel a run during publication.
concurrency:
  group: can-database-main
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  sync:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || vars.CAN_SYNC_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Initialize temporary paths
        run: |
          mkdir -p "$RUNNER_TEMP/can-sync"
          echo "CAN_ARTIFACTS=$RUNNER_TEMP/can-sync/artifacts" >> "$GITHUB_ENV"
          echo "BUNDLE_GEMFILE=$RUNNER_TEMP/can-sync/Gemfile" >> "$GITHUB_ENV"

      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install CAN tooling
        run: python -m pip install -r tools/can_sync/requirements.txt

      - name: Test the sync pipeline
        run: python -m unittest discover -s tools/can_sync/tests -q

      - name: Download latest saved SharePoint workbook
        env:
          CAN_WORKBOOK_URL: ${{ secrets.CAN_WORKBOOK_URL }}
        run: python tools/can_sync/download.py --output "$RUNNER_TEMP/can-sync/source.xlsx"

      - name: Validate workbook and generate DBC and headers
        run: python tools/can_sync/pipeline.py prepare --workbook "$RUNNER_TEMP/can-sync/source.xlsx" --artifacts "$CAN_ARTIFACTS"

      - name: Compare generated definitions
        id: generated
        run: python tools/can_sync/pipeline.py stage --artifacts "$CAN_ARTIFACTS"

      - name: Compile generated CAN declarations
        run: printf '#include "can_board_defs.h"\n' | cc -std=c11 -Wall -Wextra -Werror -fsyntax-only -x c -I "$CAN_ARTIFACTS" -

      - name: Downloadable CAN files
        uses: actions/upload-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: can-database
          path: ${{ env.CAN_ARTIFACTS }}/*
          if-no-files-found: error
          retention-days: 30

      - name: Set up Ruby
        if: steps.generated.outputs.changed == 'true'
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1
        with:
          ruby-version: '3.2'

      - name: Run C regression tests before publishing
        if: steps.generated.outputs.changed == 'true'
        run: |
          # Keep Bundler's generated lockfile outside the checkout.
          cp Gemfile "$BUNDLE_GEMFILE"
          bundle install
          bundle exec ceedling test:all

      - name: Commit to main and increment patch tag
        if: steps.generated.outputs.changed == 'true'
        run: python tools/can_sync/pipeline.py publish

      - name: Resolve CAN release tag
        id: release
        run: python tools/can_sync/pipeline.py release-tag

      - name: Publish release or retry an incomplete release
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          CAN_TAG: ${{ steps.release.outputs.tag }}
        run: |
          # GITHUB_TOKEN pushes do not trigger push workflows. Explicit dispatch
          # runs the existing release/docs pipeline at the new tag instead.
          ready=$(gh release view "$CAN_TAG" --json assets --jq '(["MAIN_DBC.dbc", "can_signal_defs.h", "can_board_defs.h", "can-database-source.json"] - [.assets[].name]) | length == 0' 2>/dev/null || true)
          if [ "$ready" != 'true' ]; then
            gh workflow run release.yml --ref "$CAN_TAG"
          fi

      - name: Summarize
        env:
          CHANGED: ${{ steps.generated.outputs.changed }}
          CAN_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [ "$CHANGED" = 'true' ]; then
            echo "Published CAN definitions to main with tag $CAN_TAG." >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Generated definitions are unchanged; no commit or version bump.' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Download MAIN_DBC.dbc and the headers from the can-database artifact on this run.' >> "$GITHUB_STEP_SUMMARY"
